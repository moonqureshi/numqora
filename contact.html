<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us - Numqora</title>
  <meta name="description" content="Contact Numqora for questions, feedback, or suggestions.">

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f7fb;
      color:#222;

    header{

      color:white;
      text-align:center;
      padding:30px 20px;
    }

    main{
      max-width:800px;
      margin:40px auto;
      padding:0 20px;
    }

    .card{

      padding:30px;
      border-radius:14px;
      box-shadow:0 4px 15px rgba(0,0,0,.08);
    }

    p{
      line-height:1.7;
    }

    a{
      color:#2563eb;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Contact Us</h1>
  <p>We'd love to hear from you</p>
</header>

<main>
  <div class="card">

    <h2>Get in Touch</h2>

    <p>
      If you have a question, suggestion, or feedback about Numqora,
      we'd be happy to hear from you.
    </p>

    <p>
      You can contact us by email:
    </p>

    <p>
      <a href="mailto:contact@numqora.com">contact@numqora.com</a>
    </p>

    <p>
      We aim to review messages and respond as soon as possible.
    </p>

    <p>
      <a href="index.html">← Back to Calculators</a>
