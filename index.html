<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free Percentage & Age Calculator | Numqora</title>
  <meta name="description" content="Free online percentage and age calculators. Calculate percentages, percentage increase or decrease, and exact age easily.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #ddd;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      border: none;
      border-radius: 7px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #f0f2f5;
      border-radius: 7px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>Numqora Calculators</h1>
  <p>Free online calculators for everyday use</p>
</header>

<div class="container">

  <!-- Calculator 1 -->
  <div class="card">
    <h2>What is X% of Y?</h2>

    <label>Percentage (%)</label>
    <input type="number" id="percent1" placeholder="Example: 20">

    <label>Number</label>
    <input type="number" id="number1" placeholder="Example: 500">

    <button onclick="calculate1()">Calculate</button>

    <div class="result" id="result1">Result will appear here</div>
  </div>


  <!-- Calculator 2 -->
  <div class="card">
    <h2>X is What % of Y?</h2>

    <label>Number (X)</label>
    <input type="number" id="number2" placeholder="Example: 50">

    <label>Total (Y)</label>
    <input type="number" id="total2" placeholder="Example: 200">

    <button onclick="calculate2()">Calculate</button>

    <div class="result" id="result2">Result will appear here</div>
  </div>


  <!-- Calculator 3 -->
  <div class="card">
    <h2>Percentage Increase or Decrease</h2>

    <label>Original Value</label>
    <input type="number" id="original3" placeholder="Example: 100">

    <label>New Value</label>
    <input type="number" id="new3" placeholder="Example: 120">

    <button onclick="calculate3()">Calculate</button>

    <div class="result" id="result3">Result will appear here</div>
  </div>


  <!-- Age Calculator -->
  <div class="card">
    <h2>Age Calculator</h2>

    <label>Date of Birth</label>
    <input type="date" id="dob">

    <button onclick="calculateAge()">Calculate Age</button>

    <div class="result" id="ageResult">Your age will appear here</div>
  </div>

</div>

<footer>
  <p>© 2026 Numqora. Free Online Calculators.</p>
</footer>


<script>

function calculate1() {
  const percentage = parseFloat(document.getElementById("percent1").value);
  const number = parseFloat(document.getElementById("number1").value);

  if (isNaN(percentage) || isNaN(number)) {
    document.getElementById("result1").innerText = "Please enter valid numbers.";
    return;
  }

  const result = (percentage / 100) * number;

  document.getElementById("result1").innerText =
    percentage + "% of " + number + " = " + result;
}


function calculate2() {
  const number = parseFloat(document.getElementById("number2").value);
  const total = parseFloat(document.getElementById("total2").value);

  if (isNaN(number) || isNaN(total) || total === 0) {
    document.getElementById("result2").innerText =
      "Please enter valid numbers.";
    return;
  }

  const result = (number / total) * 100;

  document.getElementById("result2").innerText =
    number + " is " + result.toFixed(2) + "% of " + total;
}


function calculate3() {
  const original = parseFloat(document.getElementById("original3").value);
  const newValue = parseFloat(document.getElementById("new3").value);

  if (isNaN(original) || isNaN(newValue) || original === 0) {
    document.getElementById("result3").innerText =
      "Please enter valid numbers.";
    return;
  }

  const change = ((newValue - original) / original) * 100;

  if (change > 0) {
    document.getElementById("result3").innerText =
      "Percentage Increase: " + change.toFixed(2) + "%";
  } else if (change < 0) {
    document.getElementById("result3").innerText =
      "Percentage Decrease: " + Math.abs(change).toFixed(2) + "%";
  } else {
    document.getElementById("result3").innerText =
      "No percentage change.";
  }
}


function calculateAge() {
  const dobValue = document.getElementById("dob").value;

  if (!dobValue) {
    document.getElementById("ageResult").innerText =
      "Please select your date of birth.";
    return;
  }

  const dob = new Date(dobValue + "T00:00:00");
  const today = new Date();

  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();

  if (days < 0) {
    months--;

    const previousMonth = new Date(
      today.getFullYear(),
      today.getMonth(),
      0
    );

    days += previousMonth.getDate();
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  if (dob > today) {
    document.getElementById("ageResult").innerText =
      "Date of birth cannot be in the future.";
    return;
  }

  document.getElementById("ageResult").innerText =
    "You are " + years + " years, " +
    months + " months, and " +
    days + " days old.";
}

</script>

</body>
</html>
